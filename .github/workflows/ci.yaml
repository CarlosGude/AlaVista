---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?match=test
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction --allow-no-migration
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Run Behat
        run: docker compose exec -T php vendor/bin/behat
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_PYTHON_BLACK: false
          # The PHP linters need "composer install", which fails with the PHP shipped in the
          # super-linter image (no ext-xml). PHP is checked in the php container instead.
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
          # Prettier would indent the Flex recipe markers and rewrite the Symfony config style;
          # yamllint still validates the YAML files
          VALIDATE_YAML_PRETTIER: false
          # Generated files
          FILTER_REGEX_EXCLUDE: .*/(composer\.lock|symfony\.lock|config/reference\.php)$
  build:
    name: Build production image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, lint]
    # Native arm64 runner: the image runs on a Raspberry Pi
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compute the image tag
        id: tag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_prod
          platforms: linux/arm64
          push: true
          tags: ghcr.io/carlosgude/alavista:${{ steps.tag.outputs.image_tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  deploy:
    name: Deploy
    # Set the RASPBERRY_DEPLOY_ENABLED repository variable to "true" once the Pi is ready
    if: vars.RASPBERRY_DEPLOY_ENABLED == 'true'
    needs: build
    uses: ./.github/workflows/deploy.yaml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
